<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Reseñas de Profesores - UTP</title>
    <link rel="stylesheet" href="style_new.css">
</head>
<body>
    <!-- HEADER CON PERFIL DEL USUARIO -->
    <div id="headerPerfil" class="header-perfil" style="display: none;">
        <div class="contenedor-header">
            <div class="logo-header">
                <span class="icono-perfil">👤</span>
                <span id="nombreUsuarioHeader" class="nombre-usuario"></span>
            </div>
            <button id="btnReseña" class="btn-resena-header" onclick="mostrarCapaResena()">✍️ Deje su reseña</button>
        </div>
    </div>

    <div class="container">
        <!-- CAPA 1: INFORMACIÓN DEL ESTUDIANTE -->
        <div id="layer1" class="layer active">
            <div class="form-box">
                <h1>Bienvenido a UTP</h1>
                <h2>Ingresa tu información</h2>
                <form onsubmit="guardarInfoEstudiante(event)">
                    <div class="form-group">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" required placeholder="Ingresa tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" required placeholder="Ingresa tu apellido">
                    </div>
                    <div class="form-group">
                        <label for="carrera">Carrera que estoy cursando:</label>
                        <select id="carrera" required>
                            <option value="">-- Selecciona tu carrera --</option>
                            <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                            <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
                            <option value="Ingeniería Ambiental">Ingeniería Ambiental</option>
                            <option value="Ingeniería Civil">Ingeniería Civil</option>
                            <option value="Ingeniería de Software">Ingeniería de Software</option>
                            <option value="Ingeniería de Telecomunicaciones">Ingeniería de Telecomunicaciones</option>
                            <option value="Arquitectura">Arquitectura</option>
                            <option value="Administración">Administración</option>
                            <option value="Negocios">Negocios</option>
                            <option value="Psicología">Psicología</option>
                            <option value="Derecho">Derecho</option>
                            <option value="Medicina">Medicina</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary">Ingresar</button>
                </form>
            </div>
        </div>

        <!-- CAPA 2: PANTALLA PRINCIPAL (VER TODAS LAS RESEÑAS) -->
        <div id="layer2" class="layer">
            <div class="reseñas-principales">
                <h2>Reseñas de Profesores</h2>
                <div id="listaPrincipales" class="lista-profesores"></div>
            </div>
        </div>

        <!-- CAPA 3: DETALLES DEL PROFESOR -->
        <div id="layer3" class="layer">
            <div class="detalle-profesor-box">
                <button class="btn-volver-detalle" onclick="mostrarCapaPrincipal()">← Volver</button>
                <div id="detalleProfesorContent"></div>
            </div>
        </div>

        <!-- CAPA 4: DEJAR RESEÑA -->
        <div id="layer4" class="layer">
            <div class="form-box">
                <h2>Deja tu Reseña</h2>
                <button class="btn-volver-resena" onclick="mostrarCapaPrincipal()">← Volver al inicio</button>
                <form onsubmit="guardarResena(event)" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="nombreProfesor">Nombre del Profesor:</label>
                        <input type="text" id="nombreProfesor" required placeholder="Ingresa el nombre del profesor">
                    </div>
                    <div class="form-group">
                        <label for="materiaProfesor">Materia Impartida:</label>
                        <input type="text" id="materiaProfesor" required placeholder="Ingresa la materia">
                    </div>
                    <div class="form-group">
                        <label for="carreraProfesor">Carrera:</label>
                        <select id="carreraProfesor" required>
                            <option value="">-- Selecciona la carrera --</option>
                            <option value="Ingeniería de Sistemas">Ingeniería de Sistemas</option>
                            <option value="Ingeniería Industrial">Ingeniería Industrial</option>
                            <option value="Ingeniería Electrónica">Ingeniería Electrónica</option>
                            <option value="Ingeniería Ambiental">Ingeniería Ambiental</option>
                            <option value="Ingeniería Civil">Ingeniería Civil</option>
                            <option value="Ingeniería de Software">Ingeniería de Software</option>
                            <option value="Ingeniería de Telecomunicaciones">Ingeniería de Telecomunicaciones</option>
                            <option value="Arquitectura">Arquitectura</option>
                            <option value="Administración">Administración</option>
                            <option value="Negocios">Negocios</option>
                            <option value="Psicología">Psicología</option>
                            <option value="Derecho">Derecho</option>
                            <option value="Medicina">Medicina</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="puntaje">Puntaje (1-5):</label>
                        <select id="puntaje" required>
                            <option value="">-- Selecciona un puntaje --</option>
                            <option value="5">5 - Excelente</option>
                            <option value="4">4 - Bueno</option>
                            <option value="3">3 - Regular</option>
                            <option value="2">2 - Malo</option>
                            <option value="1">1 - Muy Malo</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="resena">Tu Reseña:</label>
                        <textarea id="resena" required placeholder="Escribe tu reseña sobre el profesor" rows="5"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Enviar Reseña</button>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Universidad Tecnológica del Perú. Todos los derechos reservados.</p>
    </footer>

    <script>
        // Variables globales
        let estudianteActual = null;
        let resenas = JSON.parse(localStorage.getItem('resenas')) || [];

        function guardarInfoEstudiante(e) {
            e.preventDefault();
            const nombre = document.getElementById('nombre').value;
            const apellido = document.getElementById('apellido').value;
            const carrera = document.getElementById('carrera').value;

            estudianteActual = {
                nombre: nombre,
                apellido: apellido,
                carrera: carrera,
                nombreCompleto: `${nombre} ${apellido}`
            };

            // Guardar en sessionStorage (se borra al cerrar la pestaña)
            sessionStorage.setItem('estudianteActual', JSON.stringify(estudianteActual));

            // Mostrar header de perfil
            document.getElementById('headerPerfil').style.display = 'block';
            document.getElementById('nombreUsuarioHeader').textContent = estudianteActual.nombreCompleto;

            // Limpiar formulario
            document.getElementById('nombre').value = '';
            document.getElementById('apellido').value = '';
            document.getElementById('carrera').value = '';

            mostrarCapaPrincipal();
        }

        function mostrarCapaPrincipal() {
            ocultarTodasLasCapas();
            document.getElementById('layer2').classList.add('active');
            mostrarReseñasPrincipales();
        }

        function mostrarCapaResena() {
            ocultarTodasLasCapas();
            document.getElementById('layer4').classList.add('active');
        }

        function mostrarDetalleProfesor(nombreProfesor) {
            // Calcular promedio y contar reseñas del profesor
            const resenasProfesor = resenas.filter(r => r.nombreProfesor === nombreProfesor);
            const promedio = resenasProfesor.length > 0 
                ? (resenasProfesor.reduce((sum, r) => sum + r.puntaje, 0) / resenasProfesor.length).toFixed(1)
                : 'Sin reseñas';

            ocultarTodasLasCapas();
            document.getElementById('layer3').classList.add('active');

            let htmlDetalle = `
                <h2>${nombreProfesor}</h2>
                <div class="profesor-stats">
                    <div class="stat"><strong>Promedio:</strong> <span class="promedio-badge">${promedio}</span></div>
                    <div class="stat"><strong>Total de reseñas:</strong> ${resenasProfesor.length}</div>
                </div>
                <div class="contenedor-reseñas-scroll">
            `;

            if (resenasProfesor.length === 0) {
                htmlDetalle += '<p class="sin-resenas">No hay reseñas aún para este profesor</p>';
            } else {
                resenasProfesor.forEach(resena => {
                    const estrellas = '⭐'.repeat(resena.puntaje) + '☆'.repeat(5 - resena.puntaje);
                    htmlDetalle += `
                        <div class="resena-detalle-card">
                            <div class="resena-header-detail">
                                <div>
                                    <strong>${resena.nombreEstudiante}</strong> - ${resena.carreraEstudiante}
                                    <div class="estrellas-detalle">${estrellas} ${resena.puntaje}/5</div>
                                </div>
                                <div class="fecha-resena">${resena.fecha}</div>
                            </div>
                            <p class="comentario-resena">"${resena.resena}"</p>
                        </div>
                    `;
                });
            }

            htmlDetalle += `
                </div>
                <div class="formulario-resena-detalle">
                    <h3>Deja tu Reseña</h3>
                    <form onsubmit="guardarResenaDesdeDetalle(event, '${nombreProfesor.replace(/'/g, "\\'")}')">
                        <div class="form-group">
                            <label for="puntajeDetalle">Tu Puntaje:</label>
                            <select id="puntajeDetalle" required>
                                <option value="">-- Selecciona un puntaje --</option>
                                <option value="5">5 - Excelente</option>
                                <option value="4">4 - Bueno</option>
                                <option value="3">3 - Regular</option>
                                <option value="2">2 - Malo</option>
                                <option value="1">1 - Muy Malo</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="resenaDetalle">Tu Comentario:</label>
                            <textarea id="resenaDetalle" required placeholder="Escribe tu reseña sobre el profesor" rows="4"></textarea>
                        </div>
                        <button type="submit" class="btn-primary">Enviar mi Reseña</button>
                    </form>
                </div>
            `;

            document.getElementById('detalleProfesorContent').innerHTML = htmlDetalle;
        }

        function guardarResenaDesdeDetalle(e, nombreProfesor) {
            e.preventDefault();
            const puntaje = parseInt(document.getElementById('puntajeDetalle').value);
            const resena = document.getElementById('resenaDetalle').value;

            // Buscar la carrera y materia del profesor desde las reseñas existentes
            const resenasProfesor = resenas.filter(r => r.nombreProfesor === nombreProfesor);
            let carreraProfesor = '';
            let materiaProfesor = '';
            
            if (resenasProfesor.length > 0) {
                carreraProfesor = resenasProfesor[0].carreraProfesor;
                materiaProfesor = resenasProfesor[0].materiaProfesor;
            }

            const nuevaResena = {
                nombreProfesor: nombreProfesor,
                materiaProfesor: materiaProfesor,
                carreraProfesor: carreraProfesor,
                puntaje: puntaje,
                resena: resena,
                nombreEstudiante: estudianteActual.nombreCompleto,
                carreraEstudiante: estudianteActual.carrera,
                fecha: new Date().toLocaleDateString()
            };

            resenas.push(nuevaResena);
            localStorage.setItem('resenas', JSON.stringify(resenas));

            alert('¡Reseña guardada exitosamente!');

            // Volver a mostrar el detalle para refrescar
            mostrarDetalleProfesor(nombreProfesor);
        }

        function mostrarReseñasPrincipales() {
            // Agrupar reseñas por profesor
            const profesoresUnicos = {};
            
            resenas.forEach(resena => {
                if (!profesoresUnicos[resena.nombreProfesor]) {
                    profesoresUnicos[resena.nombreProfesor] = {
                        materia: resena.materiaProfesor,
                        carrera: resena.carreraProfesor,
                        puntajes: []
                    };
                }
                profesoresUnicos[resena.nombreProfesor].puntajes.push(resena.puntaje);
            });

            let htmlLista = '';
            Object.keys(profesoresUnicos).forEach(nombreProfesor => {
                const prof = profesoresUnicos[nombreProfesor];
                const promedio = (prof.puntajes.reduce((a, b) => a + b, 0) / prof.puntajes.length).toFixed(1);
                const estrellas = '⭐'.repeat(Math.round(promedio)) + '☆'.repeat(5 - Math.round(promedio));

                htmlLista += `
                    <div class="profesor-card-principal" onclick="mostrarDetalleProfesor('${nombreProfesor}')">
                        <div class="profesor-info-principal">
                            <h3>${nombreProfesor}</h3>
                            <p><strong>Materia:</strong> ${prof.materia}</p>
                            <p><strong>Carrera:</strong> ${prof.carrera}</p>
                        </div>
                        <div class="profesor-stats-principal">
                            <div class="estrellas-badge">${estrellas}</div>
                            <div class="promedio-text">${promedio}</div>
                            <div class="reseñas-count">${prof.puntajes.length} reseña${prof.puntajes.length !== 1 ? 's' : ''}</div>
                        </div>
                    </div>
                `;
            });

            if (htmlLista === '') {
                htmlLista = '<p class="sin-profesores">No hay reseñas aún. ¡Sé el primero en dejar una!</p>';
            }

            document.getElementById('listaPrincipales').innerHTML = htmlLista;
        }

        function guardarResena(e) {
            e.preventDefault();
            const nombreProfesor = document.getElementById('nombreProfesor').value;
            const materiaProfesor = document.getElementById('materiaProfesor').value;
            const carreraProfesor = document.getElementById('carreraProfesor').value;
            const puntaje = parseInt(document.getElementById('puntaje').value);
            const resena = document.getElementById('resena').value;

            const nuevaResena = {
                nombreProfesor: nombreProfesor,
                materiaProfesor: materiaProfesor,
                carreraProfesor: carreraProfesor,
                puntaje: puntaje,
                resena: resena,
                nombreEstudiante: estudianteActual.nombreCompleto,
                carreraEstudiante: estudianteActual.carrera,
                fecha: new Date().toLocaleDateString()
            };

            resenas.push(nuevaResena);
            localStorage.setItem('resenas', JSON.stringify(resenas));

            alert('¡Reseña guardada exitosamente!');

            // Limpiar formulario
            document.getElementById('nombreProfesor').value = '';
            document.getElementById('materiaProfesor').value = '';
            document.getElementById('carreraProfesor').value = '';
            document.getElementById('puntaje').value = '';
            document.getElementById('resena').value = '';

            mostrarCapaPrincipal();
        }

        function ocultarTodasLasCapas() {
            document.querySelectorAll('.layer').forEach(layer => {
                layer.classList.remove('active');
            });
        }

        // Inicializar
        window.onload = function() {
            resenas = JSON.parse(localStorage.getItem('resenas')) || [];
            const estudianteGuardado = sessionStorage.getItem('estudianteActual');
            if (estudianteGuardado) {
                estudianteActual = JSON.parse(estudianteGuardado);
                document.getElementById('headerPerfil').style.display = 'block';
                document.getElementById('nombreUsuarioHeader').textContent = estudianteActual.nombreCompleto;
                mostrarCapaPrincipal();
            }
        };
    </script>
</body>
</html>
