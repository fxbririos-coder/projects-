<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carta Secreta by myeya</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      margin: 0;
      padding: 0;
      background-color: #87CEFA;
    }
    .screen {
      display: none;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .active {
      display: flex;
    }
    .password-screen {
      flex-direction: column;
    }
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
    }
    .key {
      /* Botones numéricos en verde */
      background-color: #66BB6A; /* verde claro */
      color: #ffffff; /* texto en blanco para contrastar */
      border: none;
      border-radius: 10px;
      font-size: 20px;
      padding: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.08s;
    }
    .key:hover {
      background-color: #4CAF50; 
      transform: translateY(-2px);
    }
    .input-display {
      font-size: 24px;
      margin-top: 20px;
      letter-spacing: 8px;
    }
    .hint {
      font-size: 15px;
      margin-top: 8px;
      color: #ffffff; 
      font-style: italic;
      font-weight: 600;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      background: rgba(0,0,0,0.10);
      padding: 4px 8px;
      border-radius: 8px;
      display: inline-block;
    }
    .notepad {
      background-color: #fff0f6;
      border: 3px solid #f8bbd0;
      padding: 20px;
      border-radius: 20px;
      width: 90%;
      max-width: 500px;
      text-align: left;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      line-height: 1.6;
    }
    .notepad h3 {
      margin-top: 0;
    }
    
    .screen {
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, minmax(60px, 1fr));
      gap: 10px;
      margin-top: 20px;
      justify-content: center;
      width: 100%;
      max-width: 360px;
    }

    .key {
      background-color: #66BB6A; 
      color: #ffffff; 
      border: none;
      border-radius: 10px;
      font-size: 20px;
      padding: 15px;
      cursor: pointer;
      transition: background 0.2s, transform 0.08s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    
    @media (max-width: 480px) {
      h2 {
        font-size: 20px;
      }
      .input-display {
        font-size: 28px;
        margin-top: 14px;
        letter-spacing: 6px;
      }
      .keypad {
        grid-template-columns: repeat(3, minmax(64px, 1fr));
        gap: 12px;
        margin-top: 18px;
      }
      .key {
        font-size: 22px;
        padding: 18px;
        border-radius: 12px;
      }
      .notepad {
        padding: 16px;
        font-size: 16px;
        width: 95%;
      }
      .hint {
        font-size: 14px;
        padding: 6px 10px;
      }
    }
  </style>
</head>
<body>
<div id="passwordScreen" class="screen password-screen active">
  <h2>🔒 iNTRODUCE LA CONTRASEÑAAAAA!! </h2>
  <p class="hint">Pequeña pista: te confecé q me gustabas, el día... y mes...</p>
  <div class="input-display" id="inputDisplay">••••</div>
  <div class="keypad">
    <button class="key" onclick="enterDigit('1')">1</button>
    <button class="key" onclick="enterDigit('2')">2</button>
    <button class="key" onclick="enterDigit('3')">3</button>
    <button class="key" onclick="enterDigit('4')">4</button>
    <button class="key" onclick="enterDigit('5')">5</button>
    <button class="key" onclick="enterDigit('6')">6</button>
    <button class="key" onclick="enterDigit('7')">7</button>
    <button class="key" onclick="enterDigit('9')">9</button>
    <button class="key" onclick="enterDigit('8')">8</button>
    <div></div>
    <button class="key" onclick="enterDigit('0')">0</button>
    <div></div>
  </div>
</div>
<div id="notepadScreen" class="screen">
  <div class="notepad">
    <h3> (fecha) opcional </h3>
    <h4> (apodo de tu enamorada/o </h4>
    <p>
        Al despertar, recuerda que...
    </p>
    <p>
        Quiero que sepas que...
    </p>
    <p>
        A veces, me sorprendo...
    </p>
    <p>
      loviuloviuloviu...
    </p>
  </div>
</div>
<script>
  const correctPassword = '2025';
  let input = '';
  function enterDigit(digit) {
    if (input.length < 4) {
      input += digit;
    }
    const display = document.getElementById('inputDisplay');
    display.textContent = input.padEnd(4, '•');
    if (input.length === 4) {
      if (input === correctPassword) {
        document.getElementById('passwordScreen').classList.remove('active');
        document.getElementById('notepadScreen').classList.add('active');
      } else {
        alert('Contraseña incorecta, intenta de nuevo');
        input = '';
        display.textContent = '••••';
      }
    }
  }
</script>
</body>
</html>
